server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hms
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  security:
    # true  -> passwords stored exactly as typed (requested for this build)
    # false -> BCrypt hashing (recommended before any real deployment)
    plain-text-passwords: true
  jwt:
    secret: change-this-secret-to-a-long-random-string-at-least-32-bytes
    expiration-ms: 86400000
  cors:
    allowed-origin: http://localhost:4200
  seed:
    enabled: true

